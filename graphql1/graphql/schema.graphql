#import Mutations/*.graphql

type Query {
    greetings: String!
    # dirketívára példák:
    # totalAges: Int! @aggregate(model: "User", column: "age", function: SUM)
    # averageAges: Int! @aggregate(model: "User", column: "age", function: AVG)
    userAdultsCount: Int! @aggregate(model: "User", column: "id", function: COUNT, scopes: ["adult"])
    # users: [User!]! @all
    users: [User!]! @paginate
    user(id: ID! @eq): User @find  
    # itt automatikusan megtalálja az azonosítót (@eq jelentése:
    # WHERE oszlop = érték), 
    # de ha eltérnél a névtől:
    # user(felhasznalo_azonosito: ID @eq(key: "id")): User @find
    events: [Event!]! @all
    allUsers: [User!]!  @paginate
    # példa like-ra; %: bármennyi karakter, _:egy karakter
    users(name: String @where(operator: "like")): [User!]! @all
    # példa model fg-re és belongsto-ra:
    registrations: [Registration!]! @all
    
    # autentikáció:
    me: User! @auth @guard
    # autorizáció:
    registration(id: ID! @eq): Registration 
        @guard
        @find
        @can(ability: "view", find: "id")
    # resolverre példa:
    userOlders(olderThan: Int!): [User!]! @field(resolver: "App\\GraphQL\\Queries\\User@userOlder")
    totalAges: Int! @field(resolver: "App\\GraphQL\\Queries\\User@totalAgesCount")
}

type User {
    """
    A felhasználó egyedi azonosítója
    """
    id: ID!
    name: String!
    email: String!
    age: Int! @method(name: "ageCount")
    year_of_birth: Int! 
    events: [Event!]!  @belongsToMany  # ez egy fg hivatkozás a User Modelben
}

type Event {
    id: ID!
    title: String!
    early_bird_price: Int!
    price_multiplier: Float!
    early_bird_until: Date!
}

type Registration {
    id: ID!
    user_id: ID!
    event_id: ID!
    event: Event! @belongsTo
    price: Int! @method(name: "priceCount")
}


